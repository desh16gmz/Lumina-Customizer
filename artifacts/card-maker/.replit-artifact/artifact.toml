kind = "web"
previewPath = "/"
title = "Card Maker"
version = "1.0.0"
id = "artifacts/card-maker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19926

[services.development]
run = "pnpm --filter @workspace/card-maker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/card-maker", "run", "build" ]
serve = "static"
publicDir = "artifacts/card-maker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19926"
BASE_PATH = "/"
